name: android

on:
  push:
    branches: [main, android-app]
    paths: &android_paths
      - "apps/android/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/shared/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths: *android_paths

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Shared UI and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - name: Shared mobile integration tests
        run: >-
          bun run --cwd apps/web test
          src/mobilePairingIntent.test.ts src/mobileRuntime.test.ts
          src/mobileNotifications.test.ts src/wsNativeApi.test.ts
          src/wsTransport.test.ts
          src/mobileBrowser.test.ts
          src/shellBridge.test.ts src/shellSession.test.ts
          src/mobileDownloads.test.ts src/lib/browserDownload.test.ts
          src/lib/mobileBackStack.test.ts src/shellSessionExit.test.ts
          src/notifications/taskCompletion.logic.test.ts
      - name: Install browser test runtime
        run: bun run --cwd apps/web test:browser:install
      - name: Shared phone layout and settings
        run: >-
          bun run --cwd apps/web test:browser
          src/components/phone/PhoneAppShell.phone.browser.tsx
          src/components/phone/PhoneHomeScreen.phone.browser.tsx
          src/components/phone/PhonePaneScreen.phone.browser.tsx
          src/components/chat/composerPhoneChrome.browser.tsx
          src/components/onboarding/FeatureTourStep.browser.tsx
          src/components/settings/DesktopSettingsPanels.browser.tsx
          src/lib/mobileOverlayBack.browser.tsx
          src/components/BrowserPanel.external.browser.tsx
          src/components/BrowserPanel.mobile.browser.tsx
      - name: Package the desktop renderer
        run: bun run --cwd apps/android prepare:android
      - name: Native tests, lint, and release shrinking
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Device integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/android
          script: bash scripts/test-browser-device.sh emulator-5554
      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-and-tests
          path: |
            apps/android/app/build/outputs/apk/
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
