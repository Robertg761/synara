# TEMPORARY diagnostic workflow (to be removed).
name: Diag chat-follow
on:
  push:
    branches:
      - diag/chat-follow
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  browser:
    name: Diag (${{ matrix.project }} ${{ matrix.shard }} #${{ matrix.attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chat-follow, shard: 1/1, attempt: 1 }
          - { project: chat-follow, shard: 1/1, attempt: 2 }
          - { project: chat-follow, shard: 1/1, attempt: 3 }
          - { project: chat-follow, shard: 1/1, attempt: 4 }
          - { project: chat-follow, shard: 1/1, attempt: 5 }
          - { project: chat-follow, shard: 1/1, attempt: 6 }
          - { project: chat-follow, shard: 1/1, attempt: 7 }
          - { project: chat-follow, shard: 1/1, attempt: 8 }
          - { project: chat-follow, shard: 1/1, attempt: 9 }
          - { project: chat-follow, shard: 1/1, attempt: 10 }
          - { project: chat-projects, shard: 1/1, attempt: 1 }
          - { project: chat-projects, shard: 1/1, attempt: 2 }
          - { project: chat-workflows, shard: 1/1, attempt: 1 }
          - { project: components, shard: 1/3, attempt: 1 }
          - { project: components, shard: 2/3, attempt: 1 }
          - { project: components, shard: 3/3, attempt: 1 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd apps/web
          ./node_modules/.bin/playwright install chromium
      - name: Browser test
        timeout-minutes: 20
        run: bun run --cwd apps/web test:browser:ci -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
