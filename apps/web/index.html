<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the app paint into the display cutout / home-indicator area and
         is what makes `env(safe-area-inset-*)` non-zero.

         `interactive-widget=resizes-content` is half of the on-screen keyboard story, and only
         half: Chrome / Android WebView honour it and shrink the LAYOUT viewport (and with it
         `dvh` and `window.innerHeight`) to the space above the keyboard, so phone surfaces need
         no extra padding there. iOS Safari / WKWebView ignore it, and the other half —
         `src/hooks/useVisualViewportInset.ts` — publishes the visual-viewport overlap as
         `--app-keyboard-inset` for those. The two mechanisms are alternatives, not a sum: see
         that file's `computeViewportInset` doc and the `pb-keyboard-safe` utility in
         `src/index.css`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts are self-hosted through @fontsource(-variable) and imported from the bundle
         (src/bootstrap.ts for the pre-React screens, src/main.tsx for the app) so booting
         never depends on the network. -->
    <title>Synara</title>
    <style>
      /* Boot splash — shown while the JS bundle is parsing and React mounts.
         React's createRoot(...).render(...) wipes #root's children, so no teardown needed. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        /* Prevent a white flash before the app's own styles load. */
        color-scheme: light dark;
      }
      #root {
        min-height: 100vh;
      }
      .app-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        pointer-events: none;
      }
      .app-boot-splash__icon {
        width: 112px;
        height: 112px;
        opacity: 0;
        transform: scale(0.96);
        animation:
          app-boot-splash-in 420ms ease-out forwards,
          app-boot-splash-pulse 2.4s ease-in-out 420ms infinite;
      }
      @keyframes app-boot-splash-in {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes app-boot-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.98);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash__icon {
          animation: app-boot-splash-in 200ms ease-out forwards;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-splash" aria-hidden="true">
        <img class="app-boot-splash__icon" src="/synara-logo.svg" alt="" draggable="false" />
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
