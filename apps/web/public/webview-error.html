<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Synara couldn't start</title>
    <style>
      body { margin: 0; background: #101012; color: #ededf0; font: 16px/1.6 sans-serif; }
      main { max-width: 400px; margin: 64px auto; padding: 24px; }
      h1 { font-size: 26px; line-height: 1.25; }
      p { color: #c3c3cc; }
      a { display: block; padding: 12px 0; color: #c7c6ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Synara couldn't start</h1>
      <p>Synara needs an up-to-date Android System WebView to display the app.</p>
      <p>Update Android System WebView and Chrome in your app store, then reopen Synara. If both are already up to date, close and reopen the app.</p>
      <a href="https://play.google.com/store/apps/details?id=com.google.android.webview">Update Android System WebView</a>
      <a href="https://play.google.com/store/apps/details?id=com.android.chrome">Update Chrome</a>
    </main>
  </body>
</html>
